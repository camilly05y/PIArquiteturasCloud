services:
  dashboard-grupo1:
    build: .
    image: dashboard-grupo1:2.0
    container_name: dashboard-grupo1
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3000
      REFRESH_INTERVAL_MS: ${REFRESH_INTERVAL_MS:-30000}
    ports:
      - "${HOST_PORT:-8081}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
